name: Training Run

on:
  # Manually trigger from GitHub UI with optional param overrides
  workflow_dispatch:
    inputs:
      epochs:
        description: "Number of training epochs"
        required: false
        default: "50"
      learning_rate:
        description: "Learning rate"
        required: false
        default: "1e-3"
      fusion_method:
        description: "Fusion method: concat | attention | mean"
        required: false
        default: "concat"

  # Auto-trigger on pushes to main that touch model or training code
  push:
    branches: [main]
    paths:
      - "src/biometric_ml/models/**"
      - "src/biometric_ml/training/**"
      - "conf/**"

jobs:
  ingest-and-train:
    name: Ingest Data & Train Model
    runs-on: ubuntu-latest   # Replace with self-hosted GPU runner for real workloads

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run data ingestion (synthetic, 200 subjects)
        run: |
          python scripts/ingest_data.py \
            num_subjects=200 \
            data.parquet_dir=data/parquet

      - name: Verify Parquet files created
        run: |
          python -c "
          from pathlib import Path
          for split in ['train', 'val', 'test']:
              p = Path(f'data/parquet/{split}.parquet')
              assert p.exists(), f'Missing {p}'
              print(f'{p} — OK ({p.stat().st_size} bytes)')
          "

      - name: Run training
        run: |
          python scripts/train.py \
            training.epochs=${{ github.event.inputs.epochs || '5' }} \
            training.learning_rate=${{ github.event.inputs.learning_rate || '1e-3' }} \
            model.fusion.method=${{ github.event.inputs.fusion_method || 'concat' }} \
            data.parquet_dir=data/parquet \
            mlflow.tracking_uri=mlruns/

      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlflow-runs
          path: mlruns/
          retention-days: 30

      - name: Upload checkpoints
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoints
          path: checkpoints/
          retention-days: 14

