# Kaggle: ninadmehendale/multimodal-iris-fingerprint-biometric-data
raw_dir: data/data
processed_dir: data/processed
parquet_dir: data/parquet

modalities:
  fingerprint: true
  iris_left: true
  iris_right: true
  face: false
  voice: false
  gait: false

feature_dims:
  fingerprint: 49152   # 128x128x3 flattened
  iris_left: 4096      # 64x64x1 flattened
  iris_right: 4096     # 64x64x1 flattened

splits:
  train: 0.80    # ~36 subjects → ~360 rows
  val:   0.10    # ~4-5 subjects → ~45 rows
  test:  0.10

num_workers: 0
pin_memory: false
