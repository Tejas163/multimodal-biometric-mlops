raw_dir: data/data
processed_dir: data/processed
parquet_dir: data/parquet

modalities:
  fingerprint: true
  iris_left: true
  iris_right: true
  face: false
  voice: false
  gait: false

feature_dims:
  fingerprint: 49152
  iris_left: 4096
  iris_right: 4096

# 80/10/10 split by subject = 36 train / 4-5 val / 4-5 test subjects
# With 5 samples each: ~180 train / ~20 val / ~20 test rows
splits:
  train: 0.80
  val:   0.10
  test:  0.10

num_workers: 0
pin_memory: false
