# Model config — tuned for iris+fingerprint HOG features
encoder_hidden_dim: 256
encoder_dropout: 0.1      # low dropout — real data, don't over-regularise

fusion:
  method: concat           # concat | attention | mean
  hidden_dims: [512, 256]
  dropout: 0.2

num_classes: 100           # overridden at runtime from actual subject count
