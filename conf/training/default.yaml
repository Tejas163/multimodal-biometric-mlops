seed: 42
deterministic: false

epochs: 150
batch_size: 32             # larger batches work better with 1480 rows
learning_rate: 1e-3
#backbone_lr: 1e-5
weight_decay: 1e-2

scheduler:
  name: cosine
  T_max: 150
  eta_min: 1.0e-6

gradient_clip_val: 1.0
early_stopping_patience: 30

checkpoint:
  dir: checkpoints/
  save_top_k: 3
  monitor: val/loss
