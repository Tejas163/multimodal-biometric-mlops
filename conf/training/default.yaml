seed: 42
deterministic: false

epochs: 60
batch_size: 16             # larger batch = more stable gradients, less overfitting
learning_rate: 5.0e-4      # reduced — 1e-3 was too fast, caused overfitting by epoch 3
weight_decay: 1.0e-2       # stronger L2 regularisation to fight overfitting

scheduler:
  name: cosine
  T_max: 150

gradient_clip_val: 1.0
early_stopping_patience: 15   # more patience — val loss is noisy with 4 val subjects

checkpoint:
  dir: checkpoints/
  save_top_k: 3
  monitor: val/loss
