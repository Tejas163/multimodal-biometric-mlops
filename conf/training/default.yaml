seed: 42
deterministic: true

epochs: 50
batch_size: 16             # small — real dataset has few samples per subject (5 per side)
learning_rate: 3.0e-4
weight_decay: 1.0e-4

scheduler:
  name: cosine
  T_max: 50

gradient_clip_val: 1.0
early_stopping_patience: 15

checkpoint:
  dir: checkpoints/
  save_top_k: 3
  monitor: val/loss
