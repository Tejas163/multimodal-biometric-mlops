seed: 42
deterministic: false

epochs: 150
batch_size: 32
learning_rate: 1.0e-4     # was 1e-3 — too high for from-scratch CNN, causes mode collapse
backbone_lr: 1.0e-4       # unused but kept for config compat
weight_decay: 1.0e-3      # was 1e-2 — too much L2 kills gradient signal

scheduler:
  name: cosine
  T_max: 150
  eta_min: 1.0e-6

gradient_clip_val: 1.0
early_stopping_patience: 40

checkpoint:
  dir: checkpoints/
  save_top_k: 3
  monitor: val/loss
