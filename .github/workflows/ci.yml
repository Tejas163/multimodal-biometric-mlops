name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint tools
        run: |
          pip install --upgrade pip
          pip install ruff mypy types-PyYAML

      - name: Ruff lint (style + import order)
        run: ruff check src/ scripts/ tests/ --select E,W,F,I,B,UP,N

      - name: Ruff format check
        run: ruff format --check src/ scripts/ tests/

      - name: Mypy type check
        run: |
          pip install -e ".[dev]"
          mypy src/biometric_ml --ignore-missing-imports --strict-optional

  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest with coverage
        run: |
          pytest tests/ \
            --tb=short \
            --cov=biometric_ml \
            --cov-report=term-missing \
            --cov-report=xml \
            -v

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          files: coverage.xml
          fail_ci_if_error: false

  schema-validation:
    name: Schema & Parquet Validation
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run schema smoke test
        run: |
          python -c "
          from biometric_ml.data.schema import (
              FACE_SCHEMA, FINGERPRINT_SCHEMA, VOICE_SCHEMA,
              GAIT_SCHEMA, FUSED_SCHEMA, MODALITY_REGISTRY
          )
          assert len(MODALITY_REGISTRY) == 4
          print('Schema validation passed')
          "
