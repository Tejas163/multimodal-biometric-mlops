name: Training Run

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Number of training epochs"
        required: false
        default: "50"
      learning_rate:
        description: "Learning rate"
        required: false
        default: "1e-4"

  push:
    branches: [main]
    paths:
      - "src/biometric_ml/models/**"
      - "src/biometric_ml/training/**"
      - "conf/**"

jobs:
  ingest-and-train:
    name: Ingest Data & Train Model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Download dataset from Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          pip install kaggle
          kaggle datasets download \
            -d devalshah6/iris-and-fingerprint-dataset \
            -p data/data --unzip

      - name: Run data ingestion
        run: |
          python scripts/ingest_data.py \
            data.raw_dir=data/data \
            data.parquet_dir=data/parquet

      - name: Verify Parquet files
        run: |
          python -c "
          from pathlib import Path
          import pyarrow.parquet as pq
          for split in ['train', 'val', 'test']:
              p = Path(f'data/parquet/{split}.parquet')
              assert p.exists(), f'Missing {p}'
              t = pq.read_table(p)
              labels = set(t['label'].to_pylist())
              print(f'{split}.parquet — {len(t)} rows, {len(labels)} subjects')
          "

      - name: Run training
        run: |
          python scripts/train.py \
            training.epochs=${{ github.event.inputs.epochs || '50' }} \
            training.learning_rate=${{ github.event.inputs.learning_rate || '1e-4' }} \
            data.parquet_dir=data/parquet \
            mlflow.tracking_uri=sqlite:///mlflow.db

      - name: Upload MLflow DB
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlflow-database
          path: mlflow.db
          retention-days: 30

      - name: Upload checkpoints
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoints
          path: checkpoints/
          retention-days: 14
